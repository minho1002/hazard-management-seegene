<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background:#f8fafc">
  <rect x="50" y="50" width="700" height="500" rx="4" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- 기계실 -->
  <rect x="80" y="80" width="200" height="150" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="180" y="165" text-anchor="middle" font-size="14" fill="#475569" font-family="sans-serif">기계실</text>
  <!-- 전기실 -->
  <rect x="320" y="80" width="160" height="150" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="400" y="165" text-anchor="middle" font-size="14" fill="#475569" font-family="sans-serif">전기실</text>
  <!-- 보일러실 -->
  <rect x="530" y="80" width="190" height="150" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="625" y="165" text-anchor="middle" font-size="14" fill="#475569" font-family="sans-serif">보일러실</text>
  <!-- 복도 -->
  <rect x="80" y="270" width="640" height="60" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="400" y="307" text-anchor="middle" font-size="13" fill="#64748b" font-family="sans-serif">복도</text>
  <!-- 창고 -->
  <rect x="80" y="370" width="300" height="150" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="230" y="450" text-anchor="middle" font-size="14" fill="#475569" font-family="sans-serif">창고</text>
  <!-- 주차 -->
  <rect x="420" y="370" width="300" height="150" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="570" y="450" text-anchor="middle" font-size="14" fill="#475569" font-family="sans-serif">펌프실</text>
  <!-- 층 표시 -->
  <text x="400" y="30" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="bold" font-family="sans-serif">지하2층 평면도 - 본관</text>
</svg>
