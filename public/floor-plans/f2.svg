<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background:#f8fafc">
  <rect x="50" y="50" width="700" height="500" rx="4" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- 복도 -->
  <rect x="80" y="270" width="640" height="50" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="400" y="300" text-anchor="middle" font-size="13" fill="#64748b" font-family="sans-serif">복도</text>
  <!-- 사무실 201 -->
  <rect x="80" y="80" width="260" height="160" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="210" y="165" text-anchor="middle" font-size="13" fill="#475569" font-family="sans-serif">사무실 201</text>
  <!-- 사무실 202 -->
  <rect x="380" y="80" width="200" height="160" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="165" text-anchor="middle" font-size="13" fill="#475569" font-family="sans-serif">사무실 202</text>
  <!-- 회의실 203 -->
  <rect x="620" y="80" width="130" height="160" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="685" y="165" text-anchor="middle" font-size="12" fill="#475569" font-family="sans-serif">회의실 203</text>
  <!-- 사무실 204 -->
  <rect x="80" y="350" width="260" height="170" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="210" y="438" text-anchor="middle" font-size="13" fill="#475569" font-family="sans-serif">사무실 204</text>
  <!-- 서버실 -->
  <rect x="380" y="350" width="140" height="170" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="450" y="438" text-anchor="middle" font-size="12" fill="#475569" font-family="sans-serif">서버실</text>
  <!-- 화장실/계단 -->
  <rect x="560" y="350" width="190" height="170" fill="#dde1e7" stroke="#64748b" stroke-width="1.5"/>
  <text x="655" y="438" text-anchor="middle" font-size="12" fill="#475569" font-family="sans-serif">화장실/계단</text>
  <text x="400" y="30" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="bold" font-family="sans-serif">2층 평면도 - 본관</text>
</svg>
